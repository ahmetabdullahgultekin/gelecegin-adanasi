<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Civic navy -> teal gradient, mirroring the site hero (#0d1e37 -> #122a4c -> #193764 with teal glow) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1e37"/>
      <stop offset="55%" stop-color="#122a4c"/>
      <stop offset="100%" stop-color="#193764"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="85%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="12%" cy="-8%" r="65%">
      <stop offset="0%" stop-color="#22487c" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#22487c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5680b4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#glowTeal)"/>

  <!-- Subtle topographic wave lines (civic / Çukurova plain motif) -->
  <g stroke="#ffffff" fill="none" opacity="0.07">
    <path d="M0 470 Q200 410 400 470 T800 470 T1200 470" stroke-width="2"/>
    <path d="M0 520 Q200 460 400 520 T800 520 T1200 520" stroke-width="2"/>
    <path d="M0 570 Q200 510 400 570 T800 570 T1200 570" stroke-width="2"/>
  </g>

  <!-- Eyebrow pill -->
  <g transform="translate(90,118)">
    <rect x="0" y="0" width="360" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="30" cy="23" r="5" fill="#2dd4bf"/>
    <text x="52" y="31" font-family="'DejaVu Sans', 'Segoe UI', Arial, sans-serif" font-size="19" letter-spacing="3" font-weight="600" fill="#ffffff" fill-opacity="0.85">ADANA · 10 YILLIK VİZYON</text>
  </g>

  <!-- Wordmark -->
  <text x="88" y="288" font-family="'DejaVu Sans', 'Segoe UI', Arial, sans-serif" font-size="108" font-weight="800" fill="#ffffff" letter-spacing="-2">Geleceğin</text>
  <text x="88" y="408" font-family="'DejaVu Sans', 'Segoe UI', Arial, sans-serif" font-size="108" font-weight="800" letter-spacing="-2" fill="url(#accent)">Adana'sı</text>

  <!-- Accent rule -->
  <rect x="92" y="446" width="150" height="6" rx="3" fill="url(#accent)"/>

  <!-- Tagline -->
  <text x="90" y="520" font-family="'DejaVu Sans', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="500" fill="#ffffff" fill-opacity="0.9">Bağımsız · Veri odaklı · Toplum yararına</text>

  <!-- Domain -->
  <text x="90" y="568" font-family="'DejaVu Sans', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#2dd4bf" letter-spacing="1">geleceginadanasi.com.tr</text>
</svg>
